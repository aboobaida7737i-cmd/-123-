<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android AI Builder V3</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#17212b}header{background:#0b3d91;color:white;padding:24px;text-align:center}main{max-width:700px;margin:auto;padding:16px}.card{background:white;padding:18px;margin:12px 0;border-radius:16px;box-shadow:0 2px 10px #0001}input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:9px;border:1px solid #ccd5df}button{background:#1565c0;color:#fff;border:0;font-size:16px}pre{white-space:pre-wrap;background:#101820;color:#d8e8ff;padding:12px;border-radius:10px}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><header><h1>Android AI Builder V3</h1><p>ZIP → GitHub → Actions → APK Native</p></header><main><div class="card"><h2>GitHub</h2><input id="token" type="password" placeholder="GitHub Fine-grained Token"><input id="repo" placeholder="username/repository"></div><div class="card"><h2>مشروع Android</h2><input id="zip" type="file" accept=".zip"><button onclick="start()">رفع وبناء APK Native</button></div><div class="card"><h2>الحالة</h2><pre id="log">جاهز.</pre></div></main><script>const L=document.getElementById('log');function log(x){L.textContent+='\n'+x}async function gh(u,o={}){let t=document.getElementById('token').value.trim();let r=await fetch(u,{...o,headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(o.headers||{})}});if(!r.ok)throw Error((await r.text()).slice(0,500));return r.status==204?null:r.json()}function ep(p){return p.split('/').map(encodeURIComponent).join('/')}async function start(){try{let t=document.getElementById('token').value.trim(),repo=document.getElementById('repo').value.trim(),f=document.getElementById('zip').files[0];if(!t||!repo||!f)throw Error('أدخل Token والمستودع واختر ZIP');let z=await JSZip.loadAsync(f),a=[];z.forEach((p,e)=>{if(!e.dir&&!p.startsWith('__MACOSX/'))a.push([p,e])});log('عدد الملفات: '+a.length);for(let i=0;i<a.length;i++){let[p,e]=a[i],c=await e.async('base64'),body={message:'V3 upload '+p,content:c};try{let old=await gh('https://api.github.com/repos/'+repo+'/contents/'+ep(p));body.sha=old.sha}catch(_){}await gh('https://api.github.com/repos/'+repo+'/contents/'+ep(p),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(i%5==0||i==a.length-1)log('رفع '+(i+1)+'/'+a.length)}log('تم الرفع. GitHub Actions سيبني المشروع.');log('افتح Actions ثم آخر تشغيل ثم Artifacts لتحميل APK.')}catch(e){log('خطأ: '+e.message)}}</script></html>
